name: Noettic Flow macOS build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths:
      - "apps/flow/**"
      - ".github/workflows/flow-macos.yml"
  pull_request:
    paths:
      - "apps/flow/**"
      - ".github/workflows/flow-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Noettic Flow
  PROJECT: Fluid.xcodeproj
  SCHEME: Fluid

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint (strict)
        working-directory: apps/flow
        run: |
          docker run --rm \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            ghcr.io/realm/swiftlint:0.63.2 \
            lint --strict --config .swiftlint.yml

  build:
    name: Build, sign and package
    needs: lint
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/flow
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Standalone regression tests
        run: |
          sh Tests/run_wispr_dictionary_csv_tests.sh
          sh Tests/run_scratchpad_store_tests.sh
          sh Tests/run_local_ai_tests.sh
          sh Tests/run_page_presentation_tests.sh

      - name: Build Release (Apple Silicon)
        run: |
          set -o pipefail
          mkdir -p build
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify
          build_once() {
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath build/DerivedData \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "build/xcodebuild-$1.log" | xcbeautify --quiet
          }
          # Xcode's asset catalog compiler (ibtoold) crashes intermittently on hosted
          # runners. A second, incremental attempt recovers from that; real compile
          # errors fail both attempts and are printed below.
          if ! build_once 1; then
            if grep -q "CompileAssetCatalog" "build/xcodebuild-1.log" || grep -q "ibtoold" "build/xcodebuild-1.log"; then
              echo "::warning::Asset catalog compiler failed; retrying the build once."
            fi
            if ! build_once 2; then
              echo "::group::Errors (from xcodebuild-2.log)"
              grep -n -i -E "error|failed" build/xcodebuild-2.log | grep -v -i "warning" | tail -n 80 || true
              echo "::endgroup::"
              echo "::group::Last 60 lines of xcodebuild-2.log"
              tail -n 60 build/xcodebuild-2.log || true
              echo "::endgroup::"
              exit 1
            fi
          fi
          test -d "build/DerivedData/Build/Products/Release/$APP_NAME.app"

      - name: Ad-hoc sign
        run: |
          APP="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          # The CTranscribe xcframework ships with a broken Versions/Current link, which makes
          # codesign call the bundle layout ambiguous. Rebuild the standard framework symlinks
          # the same way build.sh does before signing anything.
          FW="$APP/Contents/Frameworks/CTranscribe.framework"
          if [ -d "$FW" ]; then
            test -d "$FW/Versions/A" && test -f "$FW/Versions/A/CTranscribe" && test -d "$FW/Versions/A/Resources"
            rm -rf "$FW/Versions/Current" "$FW/CTranscribe" "$FW/Resources"
            ln -s A "$FW/Versions/Current"
            ln -s Versions/Current/CTranscribe "$FW/CTranscribe"
            ln -s Versions/Current/Resources "$FW/Resources"
            codesign --force --sign - "$FW"
          fi
          # Nested helpers and frameworks first, then the outer bundle with its entitlements.
          codesign --force --deep --sign - "$APP"
          codesign --force --sign - --entitlements Fluid.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"

      - name: Package zip and dmg
        id: package
        run: |
          APP="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the app version ${VERSION}. Bump MARKETING_VERSION and CFBundleShortVersionString first." >&2
            exit 1
          fi
          rm -rf dist && mkdir -p dist/dmgroot
          cp -R "$APP" dist/dmgroot/
          ln -s /Applications dist/dmgroot/Applications
          # The zip name matches what the in-app update check looks for: <repo>-<version>.zip
          ditto -c -k --keepParent "$APP" "dist/noettic-labs-${VERSION}.zip"
          hdiutil create -volname "$APP_NAME" -srcfolder dist/dmgroot -ov -format UDZO "dist/Noettic-Flow-${VERSION}.dmg"
          rm -rf dist/dmgroot
          (cd dist && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noettic-flow-${{ steps.package.outputs.version }}-macos-arm64
          path: apps/flow/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/flow/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Noettic Flow ${{ steps.package.outputs.version }}
          files: apps/flow/dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
