<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"beats","type":"string","label":"Beat offsets (s)","default":"[0.35, 2.746]"},
    {"id":"dur","type":"number","label":"Scene length (s)","default":6.645}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Title — Claude + voice skill</title>
  </head>
  <body>
    <template>
      <style>
        #s02-root { position: absolute; inset: 0; }
        #s02-title {
          position: absolute;
          top: 96px;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
        }
        #s02-title-card {
          display: flex;
          flex-direction: column;
          gap: 22px;
          padding: 34px 48px 30px;
        }
        #s02-title-row { display: flex; align-items: center; gap: 30px; }
        #s02-title-text {
          font-size: 78px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: var(--nk-text);
          white-space: nowrap;
        }
        #s02-title-sub {
          display: flex;
          align-items: center;
          gap: 14px;
          padding-top: 20px;
          border-top: 1px solid var(--nk-line);
          font-size: 28px;
          font-weight: 500;
          color: var(--nk-muted);
        }
        #s02-sub-glyph {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 34px;
          height: 34px;
          border-radius: 9px;
          background: var(--nk-grad);
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 17px;
          color: #0a0e1a;
        }
        #s02-flow {
          position: absolute;
          left: 0;
          right: 0;
          top: 470px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s02-wire { width: 360px; }
        #s02-skill {
          display: flex;
          flex-direction: column;
          gap: 18px;
          width: 560px;
          padding: 36px 40px;
        }
        #s02-skill-head { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
      </style>

      <div id="s02-root" data-composition-id="s02-title" data-width="1920" data-height="1080">
        <div id="s02-title">
          <div class="nk-card" id="s02-title-card">
            <div id="s02-title-row">
              <span id="s02-title-text">Voice Skill</span>
              <span class="nk-pill nk-pill-accent" id="s02-badge">10 MIN</span>
            </div>
            <div id="s02-title-sub"><span id="s02-sub-glyph">›_</span><span>inside Claude</span></div>
          </div>
        </div>

        <div id="s02-flow">
          <div class="nk-card nk-node" id="s02-claude">
            <span class="nk-glyph">›_</span>
            <span class="nk-node-label">Claude</span>
          </div>
          <span class="nk-wire" id="s02-wire"><span class="nk-wire-pulse" id="s02-pulse"></span></span>
          <div class="nk-card" id="s02-skill">
            <div id="s02-skill-head"><span class="nk-file-icon"></span><span class="nk-file-name">voice/SKILL.md</span></div>
            <span class="nk-skel" style="width: 100%"></span>
            <span class="nk-skel" style="width: 82%"></span>
            <span class="nk-skel" style="width: 92%"></span>
            <span class="nk-skel" style="width: 58%"></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          const B = JSON.parse(v.beats || "[0.35, 2.746]");
          const D = Number(v.dur || 6.645);
          const tl = gsap.timeline({ paused: true });

          // Beat 0 — "So build a fix inside Claude."
          tl.fromTo("#s02-claude", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[0]);
          tl.fromTo("#s02-wire", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, B[0] + 0.45);
          tl.fromTo("#s02-skill", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[0] + 0.9);
          // A pulse keeps travelling down the wire: Claude is talking to the skill
          const runs = Math.max(1, Math.floor((D - (B[0] + 1.2)) / 1.1));
          tl.fromTo("#s02-pulse", { x: -90 }, { x: 360, duration: 1.1, ease: "power1.inOut", repeat: runs - 1 }, B[0] + 1.2);

          // Beat 1 — "It's called a voice skill, and it takes about ten minutes."
          tl.fromTo("#s02-title-card", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[1]);
          tl.fromTo("#s02-badge", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, B[1] + 2.1);

          tl.to("#s02-root", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.35);
          window.__timelines["s02-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
