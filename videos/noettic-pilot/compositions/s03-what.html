<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"beats","type":"string","label":"Beat offsets (s)","default":"[0.35, 3.685, 5.334, 8.605]"},
    {"id":"dur","type":"number","label":"Scene length (s)","default":11.629}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>What a skill is — context window + rules</title>
  </head>
  <body>
    <template>
      <style>
        #s03-root { position: absolute; inset: 0; }
        #s03-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 56px;
        }
        #s03-ctx { width: 900px; padding: 36px 40px 40px; }
        #s03-ctx-head { display: flex; align-items: center; gap: 18px; height: 64px; }
        #s03-ctx-glyph {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 46px;
          height: 46px;
          border-radius: 12px;
          background: var(--nk-grad);
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 21px;
          color: #0a0e1a;
        }
        #s03-ctx-title { font-size: 34px; font-weight: 600; color: var(--nk-text); }
        #s03-task {
          margin-left: auto;
          padding: 8px 20px;
          font-size: 21px;
          letter-spacing: 0;
          font-weight: 500;
        }
        #s03-slots {
          position: relative;
          display: flex;
          gap: 16px;
          height: 112px;
          margin: 28px 0 32px;
          padding: 14px;
          border-radius: 16px;
          border: 1px solid var(--nk-line);
          background: rgba(10, 14, 26, 0.6);
        }
        .s03-slot {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 82px;
          border-radius: 12px;
          background: #222a47;
          font-size: 22px;
          font-weight: 500;
          color: var(--nk-muted);
        }
        #s03-slot-skill {
          width: 250px;
          gap: 12px;
          background: rgba(59, 130, 246, 0.18);
          border: 1.5px solid rgba(59, 130, 246, 0.7);
          color: #bfdbfe;
          font-weight: 600;
        }
        #s03-tokens { display: flex; align-items: center; gap: 26px; }
        #s03-tokens-label { font-size: 26px; color: var(--nk-muted); }
        #s03-track {
          position: relative;
          display: block;
          flex: 1;
          height: 14px;
          border-radius: 7px;
          background: #1e2642;
          overflow: hidden;
        }
        #s03-fill {
          position: absolute;
          left: 0;
          top: 0;
          display: block;
          width: 100%;
          height: 14px;
          border-radius: 7px;
          background: var(--nk-grad);
          transform-origin: left center;
        }
        #s03-ondemand {
          position: absolute;
          left: 0;
          right: 0;
          bottom: -78px;
          display: flex;
          justify-content: center;
        }

        #s03-rules { width: 640px; padding: 36px 40px 30px; }
        #s03-rules-head {
          display: flex;
          align-items: center;
          gap: 18px;
          padding-bottom: 26px;
          margin-bottom: 8px;
          border-bottom: 1px solid var(--nk-line);
        }
        .s03-rule { display: flex; align-items: center; gap: 22px; padding: 22px 0; }
        .s03-rule-num {
          display: flex;
          flex: none;
          align-items: center;
          justify-content: center;
          width: 50px;
          height: 50px;
          border-radius: 14px;
          border: 1.5px solid rgba(6, 182, 212, 0.6);
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 22px;
          color: #a5f3fc;
        }
        .s03-rule-text { font-size: 32px; font-weight: 600; color: var(--nk-text); white-space: nowrap; }
      </style>

      <div id="s03-root" data-composition-id="s03-what" data-width="1920" data-height="1080">
        <div id="s03-stage">
          <div class="nk-card" id="s03-ctx">
            <div id="s03-ctx-head">
              <span id="s03-ctx-glyph">›_</span>
              <span id="s03-ctx-title">Context window</span>
              <span class="nk-pill nk-pill-accent" id="s03-task">Task: write a post</span>
            </div>
            <div id="s03-slots">
              <span class="s03-slot" style="width: 210px">System</span>
              <span class="s03-slot" style="width: 170px">Chat</span>
              <span class="s03-slot" id="s03-slot-skill"><span class="nk-file-icon" style="width: 22px; height: 28px; border-width: 2px"></span>voice skill</span>
            </div>
            <div id="s03-tokens">
              <span id="s03-tokens-label">Tokens</span>
              <span id="s03-track"><span id="s03-fill"></span></span>
            </div>
            <div id="s03-ondemand"><span class="nk-pill" id="s03-ondemand-pill">Loaded only when the job needs it</span></div>
          </div>

          <div class="nk-card" id="s03-rules">
            <div id="s03-rules-head"><span class="nk-file-icon"></span><span class="nk-file-name">voice/SKILL.md</span></div>
            <div class="s03-rule" id="s03-rule-1"><span class="s03-rule-num">1</span><span class="s03-rule-text">How you sound</span></div>
            <div class="s03-rule" id="s03-rule-2"><span class="s03-rule-num">2</span><span class="s03-rule-text">What you never say</span></div>
            <div class="s03-rule" id="s03-rule-3"><span class="s03-rule-num">3</span><span class="s03-rule-text">How you end</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          const B = JSON.parse(v.beats || "[0.35, 3.685, 5.334, 8.605]");
          const D = Number(v.dur || 11.629);
          const tl = gsap.timeline({ paused: true });

          // Start with the rules card out of frame so the context window owns the first beat
          gsap.set("#s03-rules", { opacity: 0 });
          gsap.set(["#s03-task", "#s03-ondemand-pill"], { opacity: 0 });

          // Beat 0 — "A skill is a file Claude reads before it writes."
          tl.fromTo("#s03-ctx", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[0]);
          tl.fromTo("#s03-fill", { scaleX: 0 }, { scaleX: 0.18, duration: 0.6, ease: "power2.out" }, B[0] + 0.3);
          tl.fromTo("#s03-slot-skill", { y: -170, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, B[0] + 1.2);
          tl.to("#s03-fill", { scaleX: 0.27, duration: 0.5, ease: "power2.out" }, B[0] + 1.6);

          // Beat 1 — "It holds your rules:"
          tl.fromTo("#s03-rules", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[1]);
          tl.set(["#s03-rule-1", "#s03-rule-2", "#s03-rule-3"], { opacity: 0.18 }, B[1]);

          // Beat 2 — "how you sound, what you never say, how you end."
          tl.to("#s03-rule-1", { opacity: 1, duration: 0.3 }, B[2]);
          tl.to("#s03-rule-2", { opacity: 1, duration: 0.3 }, B[2] + 0.95);
          tl.to("#s03-rule-3", { opacity: 1, duration: 0.3 }, B[2] + 2.05);

          // Beat 3 — "Claude only loads it when the job needs it."
          tl.to("#s03-rules", { opacity: 0.35, duration: 0.4 }, B[3]);
          tl.to("#s03-slot-skill", { y: -30, opacity: 0, duration: 0.35, ease: "power2.in" }, B[3]);
          tl.to("#s03-fill", { scaleX: 0.18, duration: 0.35 }, B[3]);
          tl.fromTo("#s03-task", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, B[3] + 0.9);
          tl.fromTo("#s03-slot-skill", { y: -170, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)", immediateRender: false }, B[3] + 1.4);
          tl.to("#s03-fill", { scaleX: 0.27, duration: 0.5, ease: "power2.out" }, B[3] + 1.6);
          tl.fromTo("#s03-ondemand-pill", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, B[3] + 1.9);

          tl.to("#s03-root", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.35);
          window.__timelines["s03-what"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
