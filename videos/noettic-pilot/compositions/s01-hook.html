<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"beats","type":"string","label":"Beat offsets (s)","default":"[0.35, 3.386, 4.907, 6.77]"},
    {"id":"dur","type":"number","label":"Scene length (s)","default":9.112}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Hook — three posts that sound the same</title>
  </head>
  <body>
    <template>
      <style>
        #s01-root { position: absolute; inset: 0; }
        #s01-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 48px;
        }
        .s01-post {
          display: flex;
          flex-direction: column;
          gap: 22px;
          width: 500px;
          padding: 40px 40px 36px;
        }
        .s01-head { display: flex; align-items: center; gap: 18px; }
        .s01-avatar {
          display: block;
          flex: none;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: #2a3354;
        }
        .s01-who { display: flex; flex-direction: column; gap: 10px; }
        .s01-line { position: relative; display: block; }
        .s01-hl {
          position: absolute;
          left: -10px;
          right: -10px;
          top: -4px;
          bottom: -4px;
          display: block;
          border-radius: 10px;
          background: rgba(245, 158, 11, 0.24);
          border: 1.5px solid rgba(245, 158, 11, 0.55);
          transform-origin: left center;
        }
        .s01-hl-b {
          background: rgba(139, 92, 246, 0.24);
          border-color: rgba(139, 92, 246, 0.6);
        }
        .s01-text {
          position: relative;
          display: block;
          font-size: 30px;
          font-weight: 600;
          line-height: 1.3;
          color: var(--nk-text);
        }
        .s01-phrase {
          position: relative;
          display: block;
          font-size: 27px;
          font-weight: 500;
          color: #cbd5e1;
        }
        .s01-foot {
          display: flex;
          gap: 14px;
          padding-top: 18px;
          border-top: 1px solid var(--nk-line);
        }
        #s01-verdict {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s01-verdict-pill {
          padding: 26px 50px;
          font-size: 50px;
          font-weight: 700;
          letter-spacing: 0;
          background: rgba(24, 16, 4, 0.92);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }
      </style>

      <div id="s01-root" data-composition-id="s01-hook" data-width="1920" data-height="1080">
        <div id="s01-stage" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="nk-card s01-post" id="s01-post-1">
            <div class="s01-head">
              <span class="s01-avatar"></span>
              <div class="s01-who"><span class="nk-skel" style="width: 180px"></span><span class="nk-skel" style="width: 110px; height: 11px"></span></div>
            </div>
            <div class="s01-line"><span class="s01-hl" id="s01-hl-1"></span><span class="s01-text">In today's fast-paced world,</span></div>
            <span class="nk-skel" style="width: 100%"></span>
            <span class="nk-skel" style="width: 86%"></span>
            <div class="s01-line"><span class="s01-hl s01-hl-b" id="s01-ph-1"></span><span class="s01-phrase">Let's dive in.</span></div>
            <span class="nk-skel" style="width: 92%"></span>
            <span class="nk-skel" style="width: 64%"></span>
            <div class="s01-foot"><span class="nk-skel" style="width: 70px"></span><span class="nk-skel" style="width: 90px"></span></div>
          </div>

          <div class="nk-card s01-post" id="s01-post-2">
            <div class="s01-head">
              <span class="s01-avatar"></span>
              <div class="s01-who"><span class="nk-skel" style="width: 150px"></span><span class="nk-skel" style="width: 130px; height: 11px"></span></div>
            </div>
            <div class="s01-line"><span class="s01-hl" id="s01-hl-2"></span><span class="s01-text">In today's fast-paced world,</span></div>
            <span class="nk-skel" style="width: 94%"></span>
            <div class="s01-line"><span class="s01-hl s01-hl-b" id="s01-ph-2"></span><span class="s01-phrase">Here's the thing.</span></div>
            <span class="nk-skel" style="width: 100%"></span>
            <span class="nk-skel" style="width: 78%"></span>
            <span class="nk-skel" style="width: 58%"></span>
            <div class="s01-foot"><span class="nk-skel" style="width: 80px"></span><span class="nk-skel" style="width: 60px"></span></div>
          </div>

          <div class="nk-card s01-post" id="s01-post-3">
            <div class="s01-head">
              <span class="s01-avatar"></span>
              <div class="s01-who"><span class="nk-skel" style="width: 170px"></span><span class="nk-skel" style="width: 96px; height: 11px"></span></div>
            </div>
            <div class="s01-line"><span class="s01-hl" id="s01-hl-3"></span><span class="s01-text">In today's fast-paced world,</span></div>
            <span class="nk-skel" style="width: 88%"></span>
            <span class="nk-skel" style="width: 100%"></span>
            <span class="nk-skel" style="width: 72%"></span>
            <div class="s01-line"><span class="s01-hl s01-hl-b" id="s01-ph-3"></span><span class="s01-phrase">It's a total game-changer.</span></div>
            <span class="nk-skel" style="width: 60%"></span>
            <div class="s01-foot"><span class="nk-skel" style="width: 64px"></span><span class="nk-skel" style="width: 96px"></span></div>
          </div>
        </div>

        <div id="s01-verdict" data-layout-allow-overlap>
          <span class="nk-pill nk-pill-warn" id="s01-verdict-pill">Sounds like AI.</span>
        </div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          const B = JSON.parse(v.beats || "[0.35, 3.386, 4.907, 6.77]");
          const D = Number(v.dur || 9.112);
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s01-stage", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);

          // Beat 0 — "Your AI writes like everyone else's AI": three posts deal in
          const tilt = [-3, 0, 3];
          ["#s01-post-1", "#s01-post-2", "#s01-post-3"].forEach((id, i) => {
            tl.fromTo(id, { y: 140, opacity: 0, rotation: 0 }, { y: i === 1 ? -14 : 14, opacity: 1, rotation: tilt[i], duration: 0.8, ease: "power3.out" }, B[0] + i * 0.22);
          });

          // Beat 1 — "Same openers": the identical first lines light up together
          tl.fromTo(["#s01-hl-1", "#s01-hl-2", "#s01-hl-3"], { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.12 }, B[1]);

          // Beat 2 — "Same tired phrases"
          tl.fromTo(["#s01-ph-1", "#s01-ph-2", "#s01-ph-3"], { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.12 }, B[2]);

          // Beat 3 — "And your customers can tell": posts fade back, verdict lands
          tl.to(["#s01-post-1", "#s01-post-2", "#s01-post-3"], { opacity: 0.28, scale: 0.95, duration: 0.5, ease: "power2.out" }, B[3]);
          tl.fromTo("#s01-verdict-pill", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, B[3] + 0.15);

          tl.to("#s01-root", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.35);
          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
