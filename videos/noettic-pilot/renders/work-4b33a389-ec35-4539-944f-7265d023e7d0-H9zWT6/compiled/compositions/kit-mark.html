<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kit — Noettic corner mark</title>
  </head>
  <body>
    <template>
      <style>
        #kit-mark-root { position: absolute; inset: 0; pointer-events: none; }
        #km-tile {
          position: absolute;
          right: 48px;
          bottom: 44px;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 92px;
          height: 92px;
          border-radius: 22px;
          background: rgba(15, 19, 38, 0.85);
          border: 1px solid rgba(255, 255, 255, 0.08);
          font-size: 40px;
          font-weight: 800;
          color: #f1f5f9;
        }
        #km-dot {
          position: absolute;
          right: 16px;
          top: 16px;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #3b82f6;
        }
      </style>

      <div id="kit-mark-root" data-composition-id="kit-mark" data-width="1920" data-height="1080">
        <div id="km-tile">N<span id="km-dot"></span></div>
      </div>

      <script>
        window.__timelines["kit-mark"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
