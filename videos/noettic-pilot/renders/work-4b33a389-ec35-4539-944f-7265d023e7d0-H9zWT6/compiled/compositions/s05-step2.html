<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"beats","type":"string","label":"Beat offsets (s)","default":"[0.35, 1.573, 4.566]"},
    {"id":"dur","type":"number","label":"Scene length (s)","default":10.705}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Step 2 — Claude writes the skill</title>
  </head>
  <body>
    <template>
      <style>
        #s05-root { position: absolute; inset: 0; }
        #s05-stage {
          position: absolute;
          left: 0;
          right: 0;
          top: 230px;
          bottom: 110px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 48px;
        }
        #s05-term { width: 860px; height: 560px; }
        #s05-doc { width: 720px; padding: 34px 40px 30px; }
        #s05-doc-head {
          display: flex;
          align-items: center;
          gap: 18px;
          padding-bottom: 24px;
          margin-bottom: 6px;
          border-bottom: 1px solid var(--nk-line);
        }
        .s05-row { padding: 22px 0; border-bottom: 1px solid var(--nk-line); }
        .s05-row:last-child { border-bottom: 0; }
        .s05-key {
          display: block;
          margin-bottom: 14px;
          font-size: 21px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--nk-muted);
        }
        .s05-vals { display: flex; flex-wrap: wrap; gap: 12px; }
        .s05-chip {
          display: inline-block;
          padding: 9px 18px;
          border-radius: 12px;
          background: #1c2444;
          border: 1px solid var(--nk-line-strong);
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 23px;
          color: var(--nk-text);
          white-space: nowrap;
        }
        .s05-chip-good { border-color: rgba(6, 182, 212, 0.6); color: #a5f3fc; }
        .s05-chip-bad {
          border-color: rgba(244, 63, 94, 0.6);
          background: rgba(244, 63, 94, 0.12);
          color: #fecdd3;
          text-decoration: line-through;
          text-decoration-thickness: 2px;
        }
      </style>

      <div id="s05-root" data-composition-id="s05-step2" data-width="1920" data-height="1080">
        <div class="nk-step" id="s05-step"><span class="nk-step-num">02</span><span class="nk-step-label">Let Claude write the skill</span></div>

        <div id="s05-stage">
          <div class="nk-window" id="s05-term">
            <div class="nk-window-bar"><span class="nk-dot"></span><span class="nk-dot"></span><span class="nk-dot"></span><span class="nk-window-title">~/my-brand — claude</span></div>
            <div class="nk-term">
              <div class="nk-term-line"><span class="nk-prompt">&gt;</span><span class="nk-type" id="s05-typed">study my writing and write a voice skill</span></div>
              <div class="nk-term-line" id="s05-l1"><span class="nk-bullet"></span><span>Read(writing/ · 10 files)</span></div>
              <div class="nk-term-line" id="s05-l2"><span class="nk-bullet"></span><span>Write(.claude/skills/voice/SKILL.md)</span></div>
              <div class="nk-term-line nk-sub" id="s05-l3"><span>└ Skill created · 3 sections</span></div>
            </div>
          </div>

          <div class="nk-card" id="s05-doc">
            <div id="s05-doc-head"><span class="nk-file-icon"></span><span class="nk-file-name">voice/SKILL.md</span></div>
            <div class="s05-row" id="s05-r1">
              <span class="s05-key">Sentence length</span>
              <div class="s05-vals"><span class="s05-chip s05-chip-good">8–14 words</span><span class="s05-chip">one idea each</span></div>
            </div>
            <div class="s05-row" id="s05-r2">
              <span class="s05-key">Favorite words</span>
              <div class="s05-vals"><span class="s05-chip s05-chip-good">build</span><span class="s05-chip s05-chip-good">plain</span><span class="s05-chip s05-chip-good">the work</span></div>
            </div>
            <div class="s05-row" id="s05-r3">
              <span class="s05-key">Never say</span>
              <div class="s05-vals"><span class="s05-chip s05-chip-bad">here's the thing</span><span class="s05-chip s05-chip-bad">let's dive in</span><span class="s05-chip s05-chip-bad">game-changer</span></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          const B = JSON.parse(v.beats || "[0.35, 1.573, 4.566]");
          const D = Number(v.dur || 10.705);
          const tl = gsap.timeline({ paused: true });
          const typed = "study my writing and write a voice skill";

          gsap.set(["#s05-l1", "#s05-l2", "#s05-l3", "#s05-doc", "#s05-r1", "#s05-r2", "#s05-r3"], { opacity: 0 });

          // Beat 0 — "Step two."
          tl.fromTo("#s05-step", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, B[0]);
          tl.fromTo("#s05-term", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, B[0] + 0.25);

          // Beat 1 — "Ask Claude to study them and write the skill."
          tl.fromTo("#s05-typed", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.3, ease: "steps(" + typed.length + ")" }, B[1]);
          tl.fromTo("#s05-l1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, B[1] + 1.55);
          tl.fromTo("#s05-l2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, immediateRender: false }, B[1] + 2.15);
          tl.fromTo("#s05-l3", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, B[1] + 2.6);
          tl.fromTo("#s05-doc", { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, B[1] + 2.4);

          // Beat 2 — "...your sentence length, your favorite words, and the phrases you would never use."
          tl.fromTo("#s05-r1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, B[2] + 0.9);
          tl.fromTo("#s05-r2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, B[2] + 2.0);
          tl.fromTo("#s05-r3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, B[2] + 3.2);

          tl.to("#s05-root", { opacity: 0, duration: 0.3, ease: "power1.in" }, D - 0.35);
          window.__timelines["s05-step2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
